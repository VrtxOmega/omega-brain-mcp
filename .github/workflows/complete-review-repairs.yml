name: Complete reviewed repair branch
on:
  push:
    branches: [fix/review-regressions-2026-09-07]
    paths: [.github/review_repairs.py, .github/workflows/complete-review-repairs.yml]
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'VrtxOmega/omega-brain-mcp' && github.ref == 'refs/heads/fix/review-regressions-2026-09-07'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python .github/review_repairs.py
      - run: python -m pytest tests/ -v
        env:
          PYTHONUTF8: '1'
      - run: python -m pip install --no-deps .
      - name: Import the installed package outside the checkout
        run: python -I -c "import omega_runtime, veritas_bridge, omega_brain_mcp_standalone as b; assert b.HAS_MCP and b.HAS_BRIDGE"
      - run: docker build -t omega-brain-review .
      - run: docker run --rm --entrypoint python omega-brain-review -c "import omega_brain_mcp_standalone as b; assert b.HAS_MCP and b.HAS_BRIDGE"
      - name: Commit only the validated repair files to this branch
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const files = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'review-files.json'), 'utf8'));
            if (files.some(p => p.startsWith('.github/') || p.includes('..') || path.isAbsolute(p))) throw Error('Unexpected publication path');
            const input = {
              branch: {repositoryNameWithOwner: `${context.repo.owner}/${context.repo.repo}`, branchName: context.ref.replace('refs/heads/', '')},
              expectedHeadOid: context.sha,
              message: {headline: 'Fix reviewed packaging, task scope, event filters and source manifests'},
              fileChanges: {additions: files.map(p => ({path: p, contents: fs.readFileSync(p).toString('base64')}))}
            };
            const result = await github.graphql('mutation($input:CreateCommitOnBranchInput!){createCommitOnBranch(input:$input){commit{oid url}}}', {input});
            core.notice(JSON.stringify(result.createCommitOnBranch.commit));
