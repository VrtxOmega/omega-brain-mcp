name: MCP contracts
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v
        env:
          PYTHONUTF8: '1'
      - run: python -m pip install --no-deps .
      - name: Import the installed package outside the checkout
        run: python -I -c "import omega_runtime, veritas_bridge, omega_brain_mcp_standalone as b; assert b.HAS_MCP and b.HAS_BRIDGE"
      - name: Build the packaged Docker runtime
        if: runner.os == 'Linux'
        run: docker build -t omega-brain-ci .
      - name: Import the full runtime as the container's non-root user
        if: runner.os == 'Linux'
        run: docker run --rm --entrypoint python omega-brain-ci -c "import omega_brain_mcp_standalone as b; assert b.HAS_MCP and b.HAS_BRIDGE"
